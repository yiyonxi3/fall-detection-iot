<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跌倒检测监控台</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    body { margin: 0; background:#09111f; color:#e5eefc; }
    header { padding:24px max(24px,5vw); border-bottom:1px solid #24334d; background:#0d1728; }
    h1 { margin:0 0 6px; font-size:24px; } header p { margin:0; color:#91a5c3; }
    main { max-width:1180px; margin:auto; padding:24px; display:grid; gap:24px; }
    section { background:#101c30; border:1px solid #24334d; border-radius:14px; padding:18px; }
    h2 { margin:0 0 14px; font-size:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(120px,1fr)); gap:12px; }
    .stat { background:#15243c; border-radius:10px; padding:14px; }
    .stat strong { display:block; margin-top:5px; font-size:26px; }
    .card { background:#15243c; border-radius:10px; padding:14px; border-left:4px solid #3b82f6; }
    .alarm { border-left-color:#ef4444; } .invalid { border-left-color:#f59e0b; }
    .row { display:flex; justify-content:space-between; gap:12px; margin-top:7px; color:#b9c7dc; }
    .value { color:#fff; font-weight:650; overflow-wrap:anywhere; } .muted { color:#91a5c3; }
    .badge { display:inline-block; margin-left:7px; padding:2px 7px; border-radius:999px; font-size:12px; }
    .test { background:#7c3aed; } .online { background:#15803d; } .offline { background:#475569; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #24334d; }
    th { color:#91a5c3; } button { color:white; background:#2563eb; border:0; border-radius:7px; padding:7px 10px; cursor:pointer; }
    button:disabled { background:#41516c; cursor:default; }
    button.secondary { background:#334155; }
    button.reviewed { background:#15803d; }
    button.manual-alarm { background:#b91c1c; }
    button.close { background:transparent; color:#b9c7dc; font-size:24px; line-height:1; padding:4px 8px; }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .actions button { white-space:nowrap; }
    .status-stack { display:grid; gap:4px; }
    .controls { display:flex; gap:20px; flex-wrap:wrap; color:#b9c7dc; }
    .controls label { cursor:pointer; }
    .controls label:has(input[type=text]) { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    input[type=text], select, textarea { box-sizing:border-box; color:#e5eefc; background:#0d1728;
      border:1px solid #41516c; border-radius:7px; padding:8px; font:inherit; }
    .note-editor { display:grid; gap:10px; margin:20px 0; }
    .note-editor label { display:grid; gap:6px; }
    .note-editor textarea { width:100%; min-height:90px; resize:vertical; }
    .history-change { white-space:pre-wrap; overflow-wrap:anywhere; min-width:220px; }
    .history-table { max-height:320px; overflow:auto; }
    .table-wrap { overflow-x:auto; }
    #message { color:#fbbf24; min-height:20px; }
    dialog { width:min(980px,calc(100vw - 32px)); max-height:calc(100vh - 32px); padding:0; border:1px solid #334766;
      border-radius:16px; color:#e5eefc; background:#101c30; box-shadow:0 24px 80px #000a; }
    dialog::backdrop { background:#020617cc; }
    .detail-shell { padding:20px; }
    .detail-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
    .detail-head h2 { margin:0 0 5px; }
    .detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:18px; }
    .detail-item { background:#15243c; border-radius:9px; padding:11px; }
    .detail-item span { display:block; color:#91a5c3; font-size:12px; margin-bottom:5px; }
    .detail-item strong { overflow-wrap:anywhere; }
    .detail-note { color:#91a5c3; margin:8px 0 12px; }
    .event-trigger { background:#3b1f2b; }
    .session-break td { background:#292414; color:#fcd34d; padding:10px; }
    .relation { display:inline-block; min-width:48px; padding:2px 6px; border-radius:999px; text-align:center; background:#334155; }
    .relation.trigger { background:#b91c1c; }
    .detail-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
    .error { color:#fca5a5; }
    .monitor-note { padding:10px; margin-top:12px; border-radius:8px; background:#292414; color:#fcd34d; }
    .monitor-note.receiving { background:#142a43; color:#bfdbfe; }
    .monitor-note.unavailable { background:#3b1f2b; color:#fecaca; }
    .evidence-panel { border:1px solid #334766; border-radius:10px; padding:14px; margin-bottom:20px; }
    .evidence-chart { width:100%; height:auto; display:block; }
    .evidence-warnings { color:#fcd34d; padding-left:20px; }
    h3 { margin:0; font-size:18px; }
    .incident-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:16px; }
    .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .card-head .badge { margin:0; white-space:nowrap; }
    .plain-summary { color:#c8d6ea; line-height:1.7; margin:14px 0; }
    .card-meta { color:#91a5c3; font-size:14px; line-height:1.7; overflow-wrap:anywhere; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
    .section-head { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; }
    .section-head h2 { margin-bottom:0; }
    .section-head + .detail-note { margin-top:12px; }
    .device-headline { font-size:20px; font-weight:700; margin:16px 0 8px; }
    .device-card .plain-summary { min-height:3em; margin:8px 0 14px; }
    .summary-panel { background:#15243c; border-radius:12px; padding:18px; margin-bottom:20px; }
    .summary-panel p { line-height:1.7; }
    details > summary { cursor:pointer; color:#b9c7dc; padding:8px 0; }
    details[open] > summary { margin-bottom:12px; }
    .technical-panel { border-top:1px solid #334766; padding-top:12px; margin-top:22px; }
    .record-list { display:grid; gap:10px; margin:14px 0; }
    .record-row { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center;
      padding:14px; background:#15243c; border-radius:10px; }
    .record-row p { margin:6px 0; line-height:1.6; overflow-wrap:anywhere; }
    .warning-text { color:#fcd34d; }
    .processing-actions { padding:14px; background:#15243c; border-radius:10px; margin-bottom:18px; }
    @media(max-width:700px){ .table-wrap{overflow:auto} .stats{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>
  <header><h1>居家跌倒监控</h1><p>查看疑似跌倒提醒，了解设备是否在工作。</p></header>
  <main>
    <div id="message"></div>
    <div id="stats" class="stats"></div>
    <input id="operator-name" type="hidden">
    <section>
      <div class="section-head"><h2>需要查看的提醒</h2><details><summary>筛选</summary><div class="controls">
        <label><input id="hide-tests" type="checkbox"> 隐藏测试设备的记录</label>
        <label><input id="open-only" type="checkbox"> 只看尚未全部查看的提醒</label>
      </div></details></div>
      <p class="detail-note">提醒表示疑似跌倒，实际情况需要核实。</p>
      <div id="incidents" class="incident-grid"></div>
      <button id="reminder-more" class="secondary" onclick="toggleMoreReminders()" hidden>查看更多待查看提醒</button>
      <p id="incident-page-note" class="detail-note"></p>
      <button id="incident-more" class="secondary" onclick="loadMoreIncidents()">加载更早的提醒</button>
    </section>
    <section><h2>设备状态</h2><div id="devices" class="grid"></div></section>
    <section><details id="history-section"><summary>已查看的提醒</summary><div id="incident-history" class="incident-grid"></div></details>
      <details class="technical-panel"><summary>技术记录（最近 50 条原始候选）</summary><div class="table-wrap"><table>
      <thead><tr><th>设备</th><th>分数 / 阈值</th><th>接收时间</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="alerts"></tbody>
    </table></div></details></section>
  </main>
  <dialog id="incident-detail-dialog" aria-labelledby="incident-detail-title">
    <div class="detail-shell"><div class="detail-head">
      <h2 id="incident-detail-title">这次提醒的情况</h2>
      <button type="button" class="close" aria-label="关闭事件详情" onclick="closeIncidentDetail()">×</button>
    </div><div id="incident-detail-body"></div></div>
  </dialog>
  <dialog id="device-detail-dialog" aria-labelledby="device-detail-title">
    <div class="detail-shell"><div class="detail-head"><h2 id="device-detail-title">设备情况</h2>
      <button type="button" class="close" aria-label="关闭设备详情" onclick="closeDeviceDetail()">×</button></div>
      <div id="device-detail-body"></div></div>
  </dialog>
  <dialog id="alert-detail-dialog" aria-labelledby="alert-detail-title">
    <div class="detail-shell">
      <div class="detail-head">
        <div><h2 id="alert-detail-title">查看并记录处理情况</h2><div id="alert-detail-subtitle" class="muted"></div></div>
        <button type="button" class="close" aria-label="关闭" onclick="closeAlertDetail()">×</button>
      </div>
      <div id="alert-detail-body" class="muted">正在加载…</div>
    </div>
  </dialog>
  <script>
    const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const pct = value => value == null ? "—" : `${(value * 100).toFixed(1)}%`;
    const time = value => value ? new Date(value).toLocaleString() : "—";
    const duration = value => value == null ? "—" : `${(Number(value) / 1000).toFixed(1)} 秒`;
    const testBadge = value => value ? '<span class="badge test">测试设备</span>' : '';
    const alertStatusLabel = value => value === 'ACKNOWLEDGED' ? '已查看' : value === 'OPEN' ? '尚未查看' : '状态未知';
    const alarmMarkLabel = value => value ? '已标记需要报警' : '未标记需要报警';
    let deviceData = [];
    let alertData = [];
    let incidentData = [];
    let incidentLimit = 50;
    let incidentMayHaveMore = true;
    let incidentLoading = false;
    let reminderDisplayLimit = 3;
    let detailIncidentId = null;
    let detailIncidentData = null;
    let incidentDetailRequestId = 0;
    let detailAlertId = null;
    let detailAlertData = null;
    let detailDeviceId = null;
    const panelStates = new Map();
    const pendingAlerts = new Set();
    const noteDrafts = new Map();
    const categories = {UNASSESSED:'尚未核实', SIMULATED_TEST:'模拟测试',
      SUSPECTED_FALSE_POSITIVE:'疑似误报', NEEDS_VERIFICATION:'需要联系核实', OTHER:'其他'};
    const categoryLabel = value => categories[value] || String(value ?? '');
    let lastSuccessfulRefreshMs = null;
    let refreshSucceeded = false;
    let refreshRequestId = 0;
    let refreshInFlight = null;
    const monitoringLabels = {UNKNOWN:'上报状态未知',UNAVAILABLE:'云端监测不可用',INVALID:'板端报告数据无效',
      PROGRESS_UNVERIFIED:'设备时间未持续推进',DELAY_SUSPECTED:'疑似上报滞后',WARMING_UP:'等待时间推进证据',REPORTING:'近期上报可用'};
    const evidenceWarnings = {RAW_IMU_NOT_AVAILABLE:'没有原始 IMU 数据，不能验证冲击、姿态或静止。',
      NOT_ALL_INFERENCE_WINDOWS_UPLOADED:'普通状态合并上传；云端不是完整的逐窗口记录。',
      NO_PRE_TRIGGER_REPORT:'缺少触发前上报。',NO_POST_TRIGGER_VALID_REPORT:'缺少触发后同配置有效上报。',
      INVALID_REPORT_IN_SPAN:'证据区间含板端 INVALID 状态。',CONFIGURATION_CHANGED_IN_SPAN:'区间内模型、阈值、pipeline 或测试标记发生变化。',
      RECEIVED_REPORT_GAP:'收到的相邻记录存在超过 7.5 秒的板端时间间隔（并非 IMU 丢样结论）。',
      EVIDENCE_POINTS_TRUNCATED:'证据展示最多 200 点，当前已截断。',DEVICE_ORDER_INCONSISTENT:'板端时间与序号顺序不一致。',
      OUT_OF_ORDER_RECEIPT:'网络接收顺序与板端顺序不同，可能为排队或迟到数据。',EARLY_SESSION_TRIGGER:'触发发生在会话早期，触发前观察不足。'};
    const incidentEvidenceLabels = {COLLECTING:'正在收集后续证据',OBSERVED:'后观察范围已到达',INCOMPLETE:'证据有缺口，需要检查'};
    const incidentReasonLabels = {POST_REPORT_TIMEOUT:'后观察期间，有效板端时间推进超过服务配置时限仍未到达。',
      SESSION_CHANGED_BEFORE_HORIZON:'后观察范围完成前设备会话发生变化。',CONFIGURATION_CHANGED:'观察期间模型、阈值、预处理或测试标记变化。',
      INVALID_REPORT:'观察期间收到 INVALID 状态。',RECEIVED_REPORT_GAP:'相邻有效接收点的板端时间间隔超过 7.5 秒。',
      RELATIVE_DELAY_SUSPECTED:'服务器接收时间相对板端时间明显滞后，超过服务配置时限。'};
    const associationLabels = {FIRST_CANDIDATE:'首个候选创建事件',SAME_SESSION_CONFIG_WITHIN_ANCHOR_10S:'同会话、同配置，距首个候选不超过 10 秒',
      OUTSIDE_ANCHOR_WINDOW_OR_LATE:'超出首候选时间窗，或迟到于事件起点',CONFIGURATION_BOUNDARY:'配置变化，单独建立事件',
      SESSION_BOUNDARY:'期间发生会话变化，单独建立事件',RECEIPT_WINDOW_EXPIRED:'接收间隔过长，单独建立事件',
      LATE_OUT_OF_ORDER_CANDIDATE:'候选迟于较新的板端记录到达，保留为独立事件'};

    function pageIsStale() {
      return !refreshSucceeded || lastSuccessfulRefreshMs == null || Date.now()-lastSuccessfulRefreshMs > 30000;
    }

    function shortTime(value) {
      if (!value) return '时间未知';
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return '时间未知';
      const options = {timeZone:'Asia/Shanghai'};
      const day = date.toLocaleDateString('zh-CN',options);
      const today = new Date().toLocaleDateString('zh-CN',options);
      const yesterday = new Date(Date.now()-86400000).toLocaleDateString('zh-CN',options);
      const clock = date.toLocaleTimeString('zh-CN',{...options,hour:'2-digit',minute:'2-digit',hour12:false});
      return `${day === today ? '今天' : day === yesterday ? '昨天' : day} ${clock}`;
    }

    function ageLabel(seconds) {
      if (!Number.isFinite(Number(seconds)) || seconds == null) return '时间未知';
      const age = Math.max(0,Math.floor(Number(seconds)));
      return age < 60 ? `${age}秒` : age < 3600 ? `${Math.floor(age/60)}分钟` : age < 86400
        ? `${Math.floor(age/3600)}小时` : `${Math.floor(age/86400)}天`;
    }

    function effectiveMonitoring(item) {
      if (pageIsStale()) return 'UNKNOWN';
      const monitoring = item.monitoring || {};
      const elapsed = Math.max(0,Math.floor((Date.now()-lastSuccessfulRefreshMs)/1000));
      const timeout = Number(monitoring.offline_after_seconds ?? 30);
      if (monitoring.report_age_seconds != null && Number(monitoring.report_age_seconds)+elapsed > timeout) return 'UNAVAILABLE';
      if (monitoring.status === 'REPORTING' && monitoring.progress_age_seconds != null &&
          Number(monitoring.progress_age_seconds)+elapsed > timeout) return 'PROGRESS_UNVERIFIED';
      return monitoring.status || 'UNKNOWN';
    }

    function devicePresentation(item) {
      const state = effectiveMonitoring(item);
      if (state === 'REPORTING') {
        const positive = ['NEW_ALARM','POSITIVE'].includes(item.state);
        return {state, working:true, style:positive ? 'alarm' : '',
          headline:positive ? '检测到疑似跌倒信号' : '正在检测',
          description:positive ? '最近一次检测触发了疑似跌倒提醒，请查看相关记录。'
            : item.state === 'NORMAL' ? '最近一次检测没有触发跌倒提醒。' : '设备正在传来新的检测数据。'};
      }
      const descriptions = {UNAVAILABLE:'设备没有传来新数据，请检查电源和网络。',
        INVALID:'设备传来的数据无法使用，请检查设备。',
        PROGRESS_UNVERIFIED:'收到了消息，但检测数据没有持续更新，请检查设备。',
        DELAY_SUSPECTED:'数据可能延迟到达，暂时无法判断当前情况。',
        WARMING_UP:'设备刚开始传来数据，正在等待新的检测结果。',
        UNKNOWN:pageIsStale() ? '页面暂时没有更新，正在尝试重新连接。' : '还没有足够的数据，请等待更新。'};
      return {state,working:false,style:'invalid',headline:state === 'WARMING_UP' ? '正在连接，等待检测' : '暂时无法判断',
        description:descriptions[state] || descriptions.UNKNOWN};
    }

    function rememberPanel(key, open) { panelStates.set(key,Boolean(open)); }

    function technicalPanel(key, content) {
      return `<details class="technical-panel" ${panelStates.get(key) ? 'open' : ''}
        ontoggle="rememberPanel('${key}',this.open)"><summary id="${key}-toggle">展开技术分析</summary>${content}</details>`;
    }

    function incidentStory(item) {
      const count = Number(item.candidate_count);
      const lead = count > 1 ? `依据：短时间内${count === 2 ? '两' : count}条运动分析评分达到提醒线，触发疑似跌倒提醒。`
        : '依据：运动分析评分达到提醒线，触发疑似跌倒提醒。';
      const evidence = item.evidence || {};
      const reasons = evidence.reasons || [];
      let followup = '正在等待后续数据，暂时无法判断当时的实际情况。';
      if (evidence.state === 'OBSERVED') followup = postReportStory(evidence.first_post_candidate_report?.state);
      else if (evidence.state === 'INCOMPLETE') followup = reasons.includes('POST_REPORT_TIMEOUT')
        ? '之后未及时收到新的有效数据，无法继续判断。请检查设备并核实当时情况。'
        : '后续数据有间隔或异常，无法连续判断。请检查设备并核实当时情况。';
      return {lead,followup,review:item.review_state === 'REVIEWED' ? '已查看'
        : Number(item.reviewed_count) > 0 ? '部分已查看' : '尚未查看'};
    }

    function postReportStory(state) {
      if (state === 'NORMAL') return '触发后首条有效记录未再达到提醒线，但不能据此排除跌倒。';
      if (state === 'POSITIVE' || state === 'NEW_ALARM') return '触发后首条有效记录仍达到提醒线，实际情况需要核实。';
      return '目前缺少足够的后续记录，实际情况需要核实。';
    }

    function shortNote(value) {
      const letters = Array.from(String(value || '').trim().replace(/\s+/g,' '));
      return letters.slice(0,48).join('')+(letters.length > 48 ? '…' : '');
    }

    function humanRecordSummary(records) {
      const filled = records.filter(item=>String(item.judgment_note || '').trim()
        || (item.judgment_category && item.judgment_category !== 'UNASSESSED'));
      if (!filled.length) return null;
      if (filled.length < records.length) return `人工记录：${filled.length}/${records.length} 条已填写，仍有记录待核实。`;
      const values = new Set(filled.map(item=>item.judgment_category || 'UNASSESSED'));
      if (values.size > 1) return '人工记录：各条核实结果不一致，请查看详情。';
      const category = filled[0].judgment_category || 'UNASSESSED';
      const notes = [...new Set(filled.map(item=>String(item.judgment_note || '').trim()))];
      if (category === 'UNASSESSED') return notes.length === 1
        ? `人工说明：${shortNote(notes[0])}（尚未填写核实结果）`
        : '人工说明已填写，核实结果尚未填写，详见详情。';
      return `人工记录：${categoryLabel(category)}。${notes.length === 1 ? shortNote(notes[0]) : '各条说明详见详情。'}`;
    }

    function recordDetailsPanel(key, label, content) {
      return `<details ${panelStates.get(key) ? 'open' : ''} ontoggle="rememberPanel('${key}',this.open)">
        <summary id="${key}-toggle">${label}</summary>${content}</details>`;
    }

    function reminderCard(item) {
      const story = incidentStory(item);
      const manual = humanRecordSummary(item.candidates || []);
      const caveat = item.evidence?.state === 'INCOMPLETE' ? ' 后续记录不足。' : '';
      return `<article class="card reminder-card ${item.requires_evidence_check ? 'invalid' : item.review_state === 'REVIEWED' ? '' : 'alarm'}">
        <div class="card-head"><h3>疑似跌倒提醒</h3><span class="badge ${item.review_state === 'REVIEWED' ? 'offline' : 'test'}">${story.review}</span></div>
        <p class="card-meta">${shortTime(item.created_at)} · ${escapeHtml(item.device_id)} ${testBadge(item.is_test)}</p>
        <p class="plain-summary">${escapeHtml(manual || story.lead+caveat)}</p>
        ${Number(item.alarm_marked_count) > 0 ? '<p class="warning-text">已有人标记需要报警，请查看处理记录。</p>' : ''}
        ${pageIsStale() ? '<p class="warning-text">页面未更新，后续情况等待刷新。</p>' : ''}
        <div class="card-footer"><span class="muted">提醒 ${Number(item.id)}${manual ? ' · 人工填写' : ' · 尚待核实'}</span>
          <button id="reminder-button-${Number(item.id)}" onclick="showIncidentDetail(${Number(item.id)})">查看详情</button></div></article>`;
    }

    function incidentQuery(limit) {
      return `/api/v1/incidents?limit=${limit}&hide_tests=${document.querySelector('#hide-tests').checked}&open_only=${document.querySelector('#open-only').checked}`;
    }

    function incidentEvidenceHtml(item) {
      const evidence = item.evidence;
      const stale = !refreshSucceeded || lastSuccessfulRefreshMs == null || Date.now()-lastSuccessfulRefreshMs > 30000;
      return `<div class="monitor-note ${evidence.state === 'INCOMPLETE' ? 'unavailable' : evidence.state === 'OBSERVED' ? 'receiving' : ''}">
        <strong>${escapeHtml(incidentEvidenceLabels[evidence.state] || evidence.state)}</strong>
        <div>${evidence.post_horizon_reached ? '已收到最后候选之后至少 10 秒的板端时间；只代表收到的窗口证据范围。' : '尚未完成最后候选后 10 秒的有效板端时间观察。'}</div>
        ${evidence.reasons.map(code=>`<div>• ${escapeHtml(incidentReasonLabels[code] || code)}</div>`).join('')}
        ${stale ? '<div>页面数据已过期，证据收集进度等待刷新。</div>' : ''}</div>`;
    }

    function renderIncidents() {
      const hideTests = document.querySelector('#hide-tests').checked;
      const openOnly = document.querySelector('#open-only').checked;
      const items = incidentData.filter(item=>(!hideTests || !item.is_test) && (!openOnly || item.review_state !== 'REVIEWED'));
      const pending = items.filter(item=>item.review_state !== 'REVIEWED');
      const reviewed = items.filter(item=>item.review_state === 'REVIEWED');
      document.querySelector('#incidents').innerHTML = pending.length ? pending.slice(0,reminderDisplayLimit).map(reminderCard).join('')
        : `<p class="muted">${lastSuccessfulRefreshMs == null ? '正在加载提醒…' : '当前已加载记录中没有待查看的提醒。'}</p>`;
      document.querySelector('#incident-history').innerHTML = reviewed.length ? reviewed.map(reminderCard).join('')
        : '<p class="muted">当前筛选下没有已查看的提醒。</p>';
      document.querySelector('#incident-page-note').textContent = `已加载 ${incidentData.length} 条提醒，其中 ${pending.length} 条待查看。更早的记录可继续加载。`;
      document.querySelector('#reminder-more').hidden = pending.length <= 3;
      document.querySelector('#reminder-more').textContent = reminderDisplayLimit === 3
        ? `展开其余 ${Math.max(0,pending.length-3)} 条已加载提醒` : '收起更多提醒';
      document.querySelector('#incident-more').disabled = incidentLoading || !incidentMayHaveMore || incidentLimit >= 200;
      document.querySelector('#incident-more').hidden = !incidentMayHaveMore;
      document.querySelector('#incident-more').textContent = incidentLoading ? '加载中…' : incidentLimit >= 200 ? '已加载最近 200 条提醒' : incidentMayHaveMore ? '加载更早的提醒' : '已加载全部匹配提醒';
    }

    function toggleMoreReminders() { reminderDisplayLimit = reminderDisplayLimit === 3 ? 200 : 3; renderIncidents(); }

    async function loadMoreIncidents() {
      if (incidentLoading || incidentLimit >= 200 || !incidentMayHaveMore) return;
      incidentLoading = true; incidentLimit = Math.min(200,incidentLimit+50); renderIncidents();
      try { if (refreshInFlight) await refreshInFlight; await refresh(); }
      finally { incidentLoading = false; renderIncidents(); }
    }

    function renderIncidentDetail(item) {
      const focusedId = document.activeElement?.id;
      const story = incidentStory(item);
      const manual = humanRecordSummary(item.candidates);
      const current = devicePresentation({monitoring:item.current_monitoring});
      const technical = `<p class="detail-note">${escapeHtml(item.incident_key)} · Session ${escapeHtml(item.session_id)} ·
          ${item.source === 'reconstructed' ? '从历史上报重建' : '随新上报关联'}</p>
        <div class="detail-grid"><div class="detail-item"><span>关联候选</span><strong>${Number(item.candidate_count)} 条</strong></div>
          <div class="detail-item"><span>关联候选最高模型分数</span><strong>${pct(item.peak_score)}</strong></div>
          <div class="detail-item"><span>板端候选时间跨度</span><strong>${duration(item.last_uptime_ms-item.first_uptime_ms)}</strong></div>
          <div class="detail-item"><span>判断规则</span><strong>首候选起 10 秒固定窗口</strong></div></div>
        ${incidentEvidenceHtml(item)}
        <p class="detail-note">模型分数不是准确率，也不是经过校准的真实跌倒概率。这里只取关联候选的最高值，不包含所有后续普通窗口。</p>
        <p class="detail-note">${item.evidence.first_post_candidate_report ? `最后候选后首个有效接收：${escapeHtml(item.evidence.first_post_candidate_report.state)} / ${pct(item.evidence.first_post_candidate_report.score)}。分数回落不确认人员安全。` : '尚无最后候选后的有效接收记录。'}</p>
        <h2>候选关联分析</h2><div class="table-wrap"><table><thead><tr><th>候选</th><th>板端时间 / 分数</th><th>关联依据</th><th>查看 / 报警标记</th><th>判断备注</th></tr></thead><tbody>
        ${item.candidates.map(candidate=>`<tr><td>#${Number(candidate.id)}</td><td>${duration(candidate.uptime_ms)} / ${pct(candidate.fall_probability)}</td>
          <td>${escapeHtml(associationLabels[candidate.relation_reason] || candidate.relation_reason)}</td>
          <td>${alertStatusLabel(candidate.status)} / ${alarmMarkLabel(candidate.alarm_required)}</td>
          <td>${escapeHtml(categoryLabel(candidate.judgment_category))}<br>${escapeHtml(candidate.judgment_note)}</td></tr>`).join('')}</tbody></table></div>
        <p class="detail-note">查看状态、需要报警标记、备注与操作历史沿用每条候选的记录。事件查看进度按候选汇总；不会向其他候选传播人工结论。</p>
        ${monitoringHtml({monitoring:item.current_monitoring})}
        <p class="detail-note">以上监测状态是当前查询结果；事件证据是历史观察。已经完成的历史观察不会因后来设备离线而变成中断。</p>
        <button class="secondary" onclick="downloadIncident(${Number(item.id)})">下载事件分析 JSON</button>`;
      const records = `<p class="plain-summary">${escapeHtml(story.lead)}</p><p class="plain-summary">${escapeHtml(story.followup)}</p>
        <p class="detail-note">时间接近不确认是同一次动作；设备评分不能确认真实跌倒。</p>
        <h2>查看与处理记录</h2>
        <p class="detail-note">${story.review}。在对应记录中查看、填写核实说明或标记需要报警。</p>
        <div class="record-list">${item.candidates.map(candidate=>`<article class="record-row"><div>
          <strong>记录 ${Number(candidate.id)} · ${shortTime(candidate.received_at)}</strong>
          <p>${alertStatusLabel(candidate.status)} · ${alarmMarkLabel(candidate.alarm_required)}</p>
          <p>人工记录：${escapeHtml(categoryLabel(candidate.judgment_category || 'UNASSESSED'))}</p>
          ${candidate.judgment_note ? `<p>核实说明：${escapeHtml(candidate.judgment_note)}</p>` : '<p class="muted">尚未填写核实说明。</p>'}
          </div><button id="record-button-${Number(candidate.id)}" class="secondary" onclick="openIncidentCandidate(${Number(candidate.id)})">查看并处理</button></article>`).join('')}</div>
        <p class="detail-note">“已查看”只表示看过记录；报警标记只记录处理决定，不会发送通知。</p>
        <div class="summary-panel"><h3>设备现在的情况</h3><p>${escapeHtml(current.headline)}：${escapeHtml(current.description)}</p>
          <p class="detail-note">这是现在的设备状态，不代表历史提醒发生时的情况。</p></div>`;
      document.querySelector('#incident-detail-body').innerHTML = `
        <div class="summary-panel"><div class="card-head"><h3>疑似跌倒提醒</h3><span class="badge offline">${story.review}</span></div>
          <p class="card-meta">提醒时间：${shortTime(item.created_at)}<br>设备：${escapeHtml(item.device_id)} ${testBadge(item.is_test)}</p>
          <p class="plain-summary">${escapeHtml(manual || story.lead)}</p>
          <p class="detail-note">${manual ? '以上为人工填写的记录，不是系统自动确认的结论。' : '实际情况尚待核实。'}</p>
          ${Number(item.alarm_marked_count) > 0 ? '<p class="warning-text">已有人标记需要报警，请查看处理记录。</p>' : ''}
          ${pageIsStale() ? '<p class="warning-text">页面未更新，后续情况等待刷新。</p>' : ''}</div>
        ${recordDetailsPanel(`incident-records-${Number(item.id)}`,'查看详细经过与各条记录',records)}
        ${technicalPanel(`incident-tech-${Number(item.id)}`,technical)}`;
      if (focusedId) document.getElementById?.(focusedId)?.focus?.({preventScroll:true});
    }

    function renderDeviceDetail() {
      const item = deviceData.find(device=>device.device_id === detailDeviceId);
      if (!item) { document.querySelector('#device-detail-body').innerHTML='<p class="muted">暂时无法取得这个设备的信息。</p>'; return; }
      const view = devicePresentation(item);
      const technical = `<div class="detail-grid">
        <div class="detail-item"><span>历史窗口模型结果</span><strong>${escapeHtml(item.detection_result)}</strong></div>
        <div class="detail-item"><span>最近窗口模型分数 / 阈值</span><strong>${pct(item.fall_probability)} / ${pct(item.threshold)}</strong></div>
        <div class="detail-item"><span>板端状态</span><strong>${escapeHtml(item.state)}</strong></div>
        <div class="detail-item"><span>模型</span><strong>${escapeHtml(item.model_version)}</strong></div>
        <div class="detail-item"><span>Pipeline</span><strong>${escapeHtml(item.pipeline_version)}</strong></div>
        <div class="detail-item"><span>Session / Sequence</span><strong>${escapeHtml(item.session_id)} / ${Number(item.sequence)}</strong></div>
        <div class="detail-item"><span>最近接收</span><strong>${time(item.received_at)}</strong></div>
        <div class="detail-item"><span>设备运行时间</span><strong>${duration(item.uptime_ms)}</strong></div></div>
        ${monitoringHtml(item)}<p class="detail-note">分数是模型对一段数据的输出，不是准确率或真实跌倒概率。历史低分不能证明人员当前安全。</p>`;
      document.querySelector('#device-detail-body').innerHTML=`<div class="summary-panel"><h3>${escapeHtml(item.device_id)} ${testBadge(item.is_test)}</h3>
        <p class="device-headline">${view.headline}</p><p>${view.description}</p>
        <p class="card-meta">最后更新：${shortTime(item.monitoring?.last_report_at || item.received_at)}</p></div>
        ${view.working ? '<p class="detail-note">这里显示最近一次检测情况。待查看的提醒仍需单独处理。</p>'
          : '<h2>可以先检查</h2><ol><li>设备是否通电。</li><li>设备是否连接到网络。</li><li>等待页面重新收到检测数据。</li></ol><p class="detail-note">目前不能仅凭页面确定具体原因。</p>'}
        ${technicalPanel('device-tech',technical)}`;
    }

    function showDeviceDetail(index) {
      const item = deviceData[index]; if (!item) return;
      detailDeviceId = item.device_id; panelStates.delete('device-tech');
      renderDeviceDetail(); document.querySelector('#device-detail-dialog').showModal();
    }

    function closeDeviceDetail() { detailDeviceId=null; document.querySelector('#device-detail-dialog').close(); }

    async function loadIncidentDetail(id) {
      const requestId = ++incidentDetailRequestId;
      try {
        const item = await getJson(`/api/v1/incidents/${id}`);
        if (detailIncidentId === id && requestId === incidentDetailRequestId) {
          detailIncidentData = item; renderIncidentDetail(item);
        }
      } catch(error) {
        if (detailIncidentId === id && requestId === incidentDetailRequestId) {
          detailIncidentData = null;
          document.querySelector('#incident-detail-body').innerHTML = '<p class="error">暂时无法加载这次提醒，请关闭后重新打开。</p>';
        }
      }
    }

    function showIncidentDetail(id) {
      detailIncidentId = id;
      detailIncidentData = null;
      document.querySelector('#incident-detail-body').innerHTML = '<p class="muted">正在加载…</p>';
      const dialog = document.querySelector('#incident-detail-dialog');
      if (!dialog.open) dialog.showModal();
      loadIncidentDetail(id);
    }

    function closeIncidentDetail() {
      detailIncidentId = null; detailIncidentData = null; ++incidentDetailRequestId;
      document.querySelector('#incident-detail-dialog').close();
    }

    function openIncidentCandidate(id) { closeIncidentDetail(); showAlertDetail(id); }

    async function downloadIncident(id) {
      try {
        const data = await getJson(`/api/v1/incidents/${id}`);
        const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
        const link = document.createElement('a'); link.href=url; link.download=`incident-${Number(id)}.json`;
        link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
      } catch(error) { alert(`事件下载失败：${error.message}`); }
    }

    function monitoringHtml(item) {
      const monitoring = item.monitoring || {status:'UNKNOWN'};
      const stalePage = !refreshSucceeded || lastSuccessfulRefreshMs == null || Date.now()-lastSuccessfulRefreshMs > 30000;
      const state = effectiveMonitoring(item);
      const style = state === 'REPORTING' ? 'receiving' : ['UNAVAILABLE','INVALID'].includes(state) ? 'unavailable' : '';
      return `<div class="monitor-note ${style}"><strong>${escapeHtml(stalePage ? '页面数据已过期，当前上报状态未知' : monitoringLabels[state] || state)}</strong>
        <div>${stalePage ? '请等待刷新恢复，不应沿用旧状态判断当前情况。' : state === 'UNAVAILABLE'
          ? '没有近期上报；断电、断网或程序停滞的具体原因未知。' : state === 'REPORTING'
          ? '只验证近期收到上报且板端时间推进，不代表采样健康或人员安全。' : '当前检测证据不足，不能按“人员正常”解释。'}</div>
        <div>人员状态：未核实 · 原始采样健康：未验证</div>
        ${monitoring.last_report_at ? `<div>最近上报：${time(monitoring.last_report_at)} · 最近时间推进：${time(monitoring.last_progress_at)}</div>` : ''}
        ${monitoring.last_session_change_at ? `<div>观察到会话变化：${time(monitoring.last_session_change_at)}（不等于已确定重启原因）</div>` : ''}</div>`;
    }

    function evidenceHtml(evidence, id) {
      if (!evidence) return '<div class="monitor-note">尚无事件证据快照，请确认后端也已更新。</div>';
      const start=Number(evidence.span_start_ms), end=Number(evidence.span_end_ms);
      const x = ms => 48+Math.max(0,Math.min(1,(Number(ms)-start)/Math.max(1,end-start)))*624;
      const y = score => 124-Math.max(0,Math.min(1,Number(score)))*100;
      const dots = evidence.points.map(point => point.score == null ? '' : `<circle cx="${x(point.uptime_ms)}" cy="${y(point.score)}"
        r="${point.is_trigger ? 5 : 3}" fill="${point.is_trigger ? '#f87171' : point.same_configuration ? '#60a5fa' : '#94a3b8'}">
        <title>${escapeHtml(`板端 ${point.uptime_ms} ms · 分数 ${pct(point.score)} · ${point.state}`)}</title></circle>`).join('');
      return `<div class="evidence-panel"><h2>事件证据（候选，不是真实跌倒确认）</h2>
        <p class="detail-note">${escapeHtml(evidence.event_key)} · 快照修订 ${Number(evidence.revision)} ·
          ${evidence.source === 'reconstructed' ? '从历史已存上报重建' : '随新上报更新'} · ${time(evidence.updated_at)}</p>
        <div class="detail-grid">
          <div class="detail-item"><span>同会话收到的证据点</span><strong>${Number(evidence.returned_point_count)} / ${Number(evidence.received_point_count)}</strong></div>
          <div class="detail-item"><span>同配置收到的最高分</span><strong>${pct(evidence.peak_received_score)}</strong></div>
          <div class="detail-item"><span>收到的高分记录</span><strong>${Number(evidence.positive_report_count)} 条</strong></div>
          <div class="detail-item"><span>高分观测跨度（非连续时长）</span><strong>${duration(evidence.positive_observed_span_ms)}</strong></div>
          <div class="detail-item"><span>首条触发后同配置有效记录</span><strong>${escapeHtml(evidence.first_post_trigger_state || '尚无')}</strong></div>
          <div class="detail-item"><span>触发后 10 秒观察范围</span><strong>${evidence.post_span_reached ? '已看到更后面的板端时间' : '尚未看到完整后观察范围'}</strong></div>
        </div>
        <svg class="evidence-chart" viewBox="0 0 720 156" role="img" aria-label="实际收到的窗口模型分数点，红点为触发，虚线为触发阈值">
          <line x1="48" y1="124" x2="672" y2="124" stroke="#64748b"/>
          <line x1="48" y1="24" x2="48" y2="124" stroke="#64748b"/>
          <line x1="48" y1="${y(evidence.threshold)}" x2="672" y2="${y(evidence.threshold)}" stroke="#fbbf24" stroke-dasharray="5 4"/>
          <line x1="${x(evidence.trigger_uptime_ms)}" y1="24" x2="${x(evidence.trigger_uptime_ms)}" y2="124" stroke="#f87171" stroke-dasharray="3 4"/>
          <text x="10" y="28" fill="#91a5c3" font-size="12">100%</text><text x="18" y="128" fill="#91a5c3" font-size="12">0%</text>
          <text x="48" y="146" fill="#91a5c3" font-size="12">板端 ${start/1000}s</text>
          <text x="600" y="146" fill="#91a5c3" font-size="12">${end/1000}s</text>${dots}</svg>
        <p class="detail-note">只绘制收到的分数点，不连线、不补造缺失窗口。蓝点同配置，灰点配置不同，红点是触发；${Number(evidence.omitted_sequence_count)} 个未收到的中间序号不能直接解释为丢包。</p>
        <ul class="evidence-warnings">${evidence.warnings.map(code=>`<li>${escapeHtml(evidenceWarnings[code] || code)}</li>`).join('')}</ul>
        <p class="detail-note">同一 ±10 秒证据范围内关联的候选报警：${evidence.related_alert_ids.map(value=>'#'+Number(value)).join('、')}。仅作关联，不合并报警或改变模型判断。</p>
        <button class="secondary" onclick="downloadEvidence(${Number(id)})">下载事件证据 JSON</button>
      </div>`;
    }

    async function downloadEvidence(id) {
      try {
        const data = await getJson(`/api/v1/alerts/${id}/evidence`);
        const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
        const link=document.createElement('a'); link.href=url; link.download=`fall-event-${Number(id)}.json`;
        link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
      } catch(error) { alert(`证据下载失败：${error.message}`); }
    }

    function rememberOperator() {
      sessionStorage.setItem('fall_operator_name', document.querySelector('#operator-name').value.trim());
    }

    function captureNoteDraft() {
      if (!detailAlertData || detailAlertId == null) return;
      const noteInput = document.querySelector('#judgment-note');
      const categoryInput = document.querySelector('#judgment-category');
      if (!noteInput || !categoryInput) return;
      const saved = detailAlertData.alert;
      const previous = noteDrafts.get(detailAlertId);
      noteDrafts.set(detailAlertId, {note:noteInput.value, category:categoryInput.value,
        expected_revision:previous?.expected_revision ?? saved.note_revision ?? 0});
    }

    function historyChanges(item) {
      const labels = {status:'查看记录', alarm_required:'需要报警标记',
        judgment_category:'判断类别', judgment_note:'判断备注'};
      const display = (key, value) => key === 'status' ? (value === 'ACKNOWLEDGED' ? '已查看' : '尚未查看')
        : key === 'alarm_required' ? alarmMarkLabel(value)
        : key === 'judgment_category' ? categoryLabel(value) : (value || '（空）');
      return Object.entries(labels).filter(([key]) => item.before[key] !== item.after[key])
        .map(([key,label]) => `${label}：${display(key,item.before[key])} → ${display(key,item.after[key])}`).join('\n');
    }

    function actionButtons(item, includeDetails = true) {
      const id = Number(item.id);
      const reviewed = item.status === 'ACKNOWLEDGED';
      const alarmRequired = Boolean(item.alarm_required);
      const disabled = pendingAlerts.has(id) ? 'disabled' : '';
      return `${includeDetails ? `<button class="secondary" onclick="showAlertDetail(${id})">查看并处理</button>` : ''}
        <button class="${reviewed ? 'reviewed' : 'secondary'}" ${disabled}
          aria-pressed="${reviewed}" title="${reviewed ? '撤销已查看标记' : '标记这条记录已被查看'}"
          onclick="setReview(${id}, ${!reviewed})">${alertStatusLabel(item.status)}</button>
        <button class="${alarmRequired ? 'manual-alarm' : 'secondary'}" ${disabled}
          aria-pressed="${alarmRequired}" title="${alarmRequired ? '取消需要报警标记' : '记录需要报警的处理决定'}"
          onclick="setAlarmMark(${id}, ${!alarmRequired})">${alarmRequired ? alarmMarkLabel(true) : '标记需要报警'}</button>`;
    }

    async function getJson(url) {
      const timeout = typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function'
        ? {signal:AbortSignal.timeout(8000)} : undefined;
      const response = timeout ? await fetch(url,timeout) : await fetch(url);
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      return response.json();
    }

    function render() {
        const focusedId = document.activeElement?.id;
        renderIncidents();
        if (detailIncidentId != null && detailIncidentData) renderIncidentDetail(detailIncidentData);
        if (detailDeviceId != null) renderDeviceDetail();
        const hideTests = document.querySelector('#hide-tests').checked;
        const openOnly = document.querySelector('#open-only').checked;
        const devices = deviceData.filter(item => !hideTests || !item.is_test);
        const alerts = alertData.filter(item => (!hideTests || !item.is_test) && (!openOnly || item.status === 'OPEN'));
        const working = devices.filter(item => devicePresentation(item).working).length;
        const pendingIncidents = incidentData.filter(item => (!hideTests || !item.is_test) && item.review_state !== 'REVIEWED').length;
        document.querySelector('#stats').innerHTML = `
          <div class="stat"><span class="muted">待查看提醒 · 已加载</span><strong>${lastSuccessfulRefreshMs == null ? '—' : pendingIncidents}</strong></div>
          <div class="stat"><span class="muted">正在检测的设备</span><strong>${pageIsStale() ? '—' : working}</strong></div>
          <div class="stat"><span class="muted">等待数据或需检查的设备</span><strong>${pageIsStale() ? '—' : devices.length-working}</strong></div>`;
        document.querySelector('#devices').innerHTML = devices.length ? devices.map(item => {
          const view = devicePresentation(item);
          const age = item.monitoring?.report_age_seconds ?? item.age_seconds;
          const elapsed = lastSuccessfulRefreshMs == null ? 0 : Math.max(0,Math.floor((Date.now()-lastSuccessfulRefreshMs)/1000));
          return `<article class="card device-card ${view.style}">
            <div class="value">${escapeHtml(item.device_id)} ${testBadge(item.is_test)}</div>
            <p class="device-headline">${view.headline}</p><p class="plain-summary">${view.description}</p>
            <div class="card-meta">最后更新：${shortTime(item.monitoring?.last_report_at || item.received_at)}<br>
              ${age == null ? '尚无更新时间' : `${ageLabel(Number(age)+elapsed)}${view.working ? '前更新' : '没有收到新数据'}`}</div>
            <div class="card-footer"><button id="device-button-${escapeHtml(item.device_id)}" class="secondary" onclick="showDeviceDetail(${deviceData.indexOf(item)})">${view.working ? '查看设备' : '检查说明'}</button></div>
          </article>`;
        }).join('') : `<p class="muted">${lastSuccessfulRefreshMs == null ? '正在加载设备情况…' : '当前筛选下没有设备。'}</p>`;

        document.querySelector('#alerts').innerHTML = alerts.length ? alerts.map(item => `
          <tr><td>${escapeHtml(item.device_id)} ${testBadge(item.is_test)}</td>
          <td>${pct(item.fall_probability)} / ${pct(item.threshold)}</td><td>${time(item.received_at)}</td>
          <td><div class="status-stack"><span>${alertStatusLabel(item.status)}</span>
          <span class="muted">${alarmMarkLabel(item.alarm_required)}</span></div></td>
          <td><div class="actions">${actionButtons(item)}</div></td></tr>`).join('') : '<tr><td colspan="5" class="muted">暂无候选报警。</td></tr>';
        if (focusedId) document.getElementById?.(focusedId)?.focus?.({preventScroll:true});
    }

    function relationLabel(relation) {
      return relation === 'trigger' ? '触发' : relation === 'before' ? '报警前' : '报警后';
    }

    function renderAlertDetail(data) {
      const alertItem = data.alert;
      const trigger = data.trigger_event;
      const context = data.context;
      const statusDetail = alertItem.status === 'ACKNOWLEDGED'
        ? `${time(alertItem.acknowledged_at)} · ${escapeHtml(alertItem.acknowledged_by || '未知操作员')}`
        : '尚未查看';
      const alarmDetail = alertItem.alarm_marked_at
        ? `${time(alertItem.alarm_marked_at)} · ${escapeHtml(alertItem.alarm_marked_by || '未知操作员')}`
        : '尚无人工标记记录';
      const draft = noteDrafts.get(Number(alertItem.id)) || {note:alertItem.judgment_note || '',
        category:alertItem.judgment_category || 'UNASSESSED'};
      const pending = pendingAlerts.has(Number(alertItem.id)) ? 'disabled' : '';
      const operations = data.operations || [];
      const historyRows = operations.map(item => `<tr>
        <td>${time(item.operated_at)}</td><td>${escapeHtml(item.operated_by)}</td>
        <td>${escapeHtml(({REVIEW:'查看记录',ALARM_MARK:'需要报警标记',NOTE:'处理备注'})[item.action] || item.action)}</td>
        <td class="history-change">${escapeHtml(historyChanges(item))}</td></tr>`).join('');
      document.querySelector('#alert-detail-subtitle').innerHTML =
        `${escapeHtml(alertItem.device_id)} ${testBadge(alertItem.is_test)} · 记录 ${Number(alertItem.id)}`;
      const sessionCount = new Set(data.context_events.map(event => event.session_id)).size;
      const rows = data.context_events.map((event, index, events) => {
        const sessionChanged = index > 0 && event.session_id !== events[index - 1].session_id;
        const boundary = sessionChanged
          ? '<tr class="session-break"><td colspan="6">设备会话已切换（Session 变化）：以下记录来自另一会话，可能与重启或重新供电有关。</td></tr>'
          : '';
        return `${boundary}
        <tr class="${event.relation === 'trigger' ? 'event-trigger' : ''}">
          <td><span class="relation ${event.relation === 'trigger' ? 'trigger' : ''}">${relationLabel(event.relation)}</span></td>
          <td>${time(event.received_at)}</td>
          <td>${escapeHtml(event.state)}</td>
          <td>${pct(event.fall_probability)}</td>
          <td>${Number(event.sequence)}</td>
          <td>${escapeHtml(event.session_id)}</td>
        </tr>`;
      }).join('');
      const technical = `
        <div class="detail-grid">
          <div class="detail-item"><span>查看状态</span><strong>${alertStatusLabel(alertItem.status)} (${escapeHtml(alertItem.status)})</strong></div>
          <div class="detail-item"><span>人工报警标记</span><strong>${alarmMarkLabel(alertItem.alarm_required)}</strong></div>
          <div class="detail-item"><span>触发分数 / 阈值</span><strong>${pct(trigger.fall_probability)} / ${pct(trigger.threshold)}</strong></div>
          <div class="detail-item"><span>板端状态</span><strong>${escapeHtml(trigger.state)}</strong></div>
          <div class="detail-item"><span>服务器接收</span><strong>${time(trigger.received_at)}</strong></div>
          <div class="detail-item"><span>Session / Sequence</span><strong>${escapeHtml(trigger.session_id)} / ${Number(trigger.sequence)}</strong></div>
          <div class="detail-item"><span>设备运行时间</span><strong>${duration(trigger.uptime_ms)}</strong></div>
          <div class="detail-item"><span>模型</span><strong>${escapeHtml(trigger.model_version)}</strong></div>
          <div class="detail-item"><span>Pipeline</span><strong>${escapeHtml(trigger.pipeline_version)}</strong></div>
          <div class="detail-item"><span>查看记录时间 / 操作员</span><strong>${statusDetail}</strong></div>
          <div class="detail-item"><span>报警标记记录</span><strong>${alarmDetail}</strong></div>
        </div>
        ${evidenceHtml(data.evidence,alertItem.id)}
        <h2>同设备前后事件</h2>
        <p class="detail-note">显示报警前 ${context.returned_before}/${context.available_before} 条、报警后 ${context.returned_after}/${context.available_after} 条；红色行为报警触发事件。不同设备的数据不会混入。</p>
        ${sessionCount > 1 ? `<p class="detail-note">本段记录包含 ${sessionCount} 个 Session，按服务器接收顺序排列；跨会话记录不能视为同一次连续运行。</p>` : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>位置</th><th>接收时间</th><th>状态</th><th>分数</th><th>Sequence</th><th>Session</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`;
      const followup = postReportStory(data.evidence?.first_post_trigger_state);
      const manual = humanRecordSummary([alertItem]);
      const explanation = `<p>设备分析当时的运动数据，给出的跌倒评分达到提醒线，因此生成记录。</p>
        <p>${escapeHtml(followup)}</p>
        ${(data.evidence?.warnings || []).some(code=>['RECEIVED_REPORT_GAP','INVALID_REPORT_IN_SPAN','CONFIGURATION_CHANGED_IN_SPAN','EVIDENCE_POINTS_TRUNCATED'].includes(code))
          ? '<p class="warning-text">前后记录有缺口或异常，不能完整对照。</p>' : ''}
        <p class="detail-note">目前没有原始动作曲线，不能确认撞击、倒地或静止；具体评分和上报记录见技术分析。</p>`;
      document.querySelector('#alert-detail-body').innerHTML = `
        <div class="summary-panel"><h3>疑似跌倒记录</h3>
          <p class="card-meta">${shortTime(trigger.received_at)} · ${escapeHtml(alertItem.device_id)}</p>
          <p>${escapeHtml(manual || '依据：运动分析评分达到提醒线，触发疑似跌倒提醒。')}</p>
          <p class="detail-note">${manual ? '以上为人工填写的记录，不是系统自动确认的结论。' : '实际情况尚待核实。'}</p>
          <p>查看状态：${alertStatusLabel(alertItem.status)}<br>处理决定：${alarmMarkLabel(alertItem.alarm_required)}</p></div>
        ${recordDetailsPanel(`alert-explanation-${Number(alertItem.id)}`,'查看判断依据与前后记录',explanation)}
        <div class="processing-actions"><label>操作员名称<input id="detail-operator-name" type="text" maxlength="100" ${pending}
            value="${escapeHtml(document.querySelector('#operator-name').value)}" placeholder="填写组员编号"
            oninput="document.querySelector('#operator-name').value=this.value; rememberOperator()"></label>
          <p class="detail-note">用于记录操作，由本人填写，不是登录身份认证。</p>
          <div class="actions">${actionButtons(alertItem,false)}</div>
          <p class="detail-note">“已查看”只表示看过记录；“标记需要报警”只记录决定，不会发送通知。未标记不表示排除跌倒。</p></div>
        <div class="note-editor">
          <h2>人工核实记录</h2>
          <p class="detail-note">保存备注不会自动改变查看状态或需要报警标记。</p>
          <p class="detail-note">备注可被页面访问者读取，请用组员编号，避免填写个人信息。</p>
          <label>核实结果<select id="judgment-category" ${pending} onchange="captureNoteDraft()">
            ${Object.entries(categories).map(([value,label]) => `<option value="${value}" ${draft.category === value ? 'selected' : ''}>${label}</option>`).join('')}
          </select></label>
          <label>核实说明<textarea id="judgment-note" maxlength="1000" ${pending} oninput="captureNoteDraft()" placeholder="例如：模拟测试；当时正在坐下；需要联系人员核实。">${escapeHtml(draft.note)}</textarea></label>
          <div class="actions"><button ${pending} onclick="saveJudgmentNote(${Number(alertItem.id)})">保存备注</button>
            <button class="secondary" ${pending} onclick="reloadJudgmentNote(${Number(alertItem.id)})">重新加载已保存备注</button></div>
          <span class="muted">最多 1000 字符，需点击保存。${alertItem.note_updated_at
            ? `最近保存：${time(alertItem.note_updated_at)} · ${escapeHtml(alertItem.note_updated_by)}` : '尚无备注保存记录。'}</span>
        </div>
        <details ${panelStates.get(`alert-history-${Number(alertItem.id)}`) ? 'open' : ''}
          ontoggle="rememberPanel('alert-history-${Number(alertItem.id)}',this.open)">
          <summary>操作历史（最近 ${operations.length} 条 / 共 ${Number(data.operations_total || 0)} 条）</summary>
          <p class="detail-note">新版本启用后记录操作，包括撤销和备注旧值；历史升级前的操作不会补造。操作员名称由本人填写。</p>
          <div class="history-table"><table><thead><tr><th>操作时间</th><th>操作员</th><th>操作</th><th>前后变化</th></tr></thead>
            <tbody>${historyRows || '<tr><td colspan="4" class="muted">尚无操作历史。</td></tr>'}</tbody></table></div>
        </details>
        ${technicalPanel(`alert-tech-${Number(alertItem.id)}`,technical)}
        <div class="detail-footer actions">
          <button class="secondary" onclick="closeAlertDetail()">关闭</button>
        </div>`;
    }

    async function loadAlertDetail(id) {
      document.querySelector('#alert-detail-body').innerHTML = '<p class="muted">正在加载…</p>';
      try {
        const data = await getJson(`/api/v1/alerts/${id}/context?before=5&after=5`);
        if (detailAlertId !== id) return;
        detailAlertData = data;
        renderAlertDetail(data);
      } catch (error) {
        if (detailAlertId !== id) return;
        document.querySelector('#alert-detail-body').innerHTML = '<p class="error">暂时无法加载这条记录，请关闭后重新打开。</p>';
      }
    }

    function showAlertDetail(id) {
      captureNoteDraft();
      detailAlertId = id;
      detailAlertData = null;
      const dialog = document.querySelector('#alert-detail-dialog');
      if (!dialog.open) dialog.showModal();
      loadAlertDetail(id);
    }

    function closeAlertDetail() {
      captureNoteDraft();
      document.querySelector('#alert-detail-dialog').close();
      detailAlertId = null;
      detailAlertData = null;
    }

    function refresh() {
      render();
      if (refreshInFlight) return refreshInFlight;
      const requestId = ++refreshRequestId;
      refreshInFlight = performRefresh(requestId).finally(()=>{refreshInFlight=null;});
      return refreshInFlight;
    }

    async function performRefresh(requestId) {
      try {
        const data = await Promise.all([
          getJson('/api/v1/devices'), getJson('/api/v1/alerts?limit=50'), getJson(incidentQuery(incidentLimit))
        ]);
        if (requestId !== refreshRequestId) return;
        deviceData = data[0];
        // Keep a successful local write when an earlier polling GET finishes later.
        alertData = data[1].map(item => pendingAlerts.has(item.id)
          ? {...item,...alertData.find(current=>current.id === item.id)} : item);
        incidentData = data[2]; incidentMayHaveMore = incidentData.length === incidentLimit;
        lastSuccessfulRefreshMs=Date.now(); refreshSucceeded=true;
        render();
        if (detailIncidentId != null) loadIncidentDetail(detailIncidentId);
        document.querySelector('#message').textContent = `页面已更新 · ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        if (requestId !== refreshRequestId) return;
        refreshSucceeded=false; render();
        document.querySelector('#message').textContent = '页面暂时无法更新，正在重试。当前设备情况无法确认。';
      }
    }

    async function updateAlertMark(id, path, body, message) {
      if (pendingAlerts.has(id)) return;
      if (!confirm(message)) return;
      const operator = document.querySelector('#operator-name').value.trim();
      if (!operator || operator.length > 100) {
        alert('请先在记录详情中填写操作员名称（组员编号，1–100 字符），以便保存处理记录。');
        return false;
      }
      rememberOperator();
      const apiKey = sessionStorage.getItem('fall_api_key') || prompt('请输入当前服务的操作密钥（仅在本机输入）');
      if (!apiKey) return;
      sessionStorage.setItem('fall_api_key', apiKey);
      captureNoteDraft();
      pendingAlerts.add(id);
      render();
      if (detailAlertId === id && detailAlertData) renderAlertDetail(detailAlertData);
      try {
        const response = await fetch(`/api/v1/alerts/${id}/${path}`, {
          method:'PATCH', headers:{'Content-Type':'application/json','X-API-Key':apiKey},
          body:JSON.stringify({...body, updated_by:operator})
        });
        if (!response.ok) {
          if (response.status === 401) sessionStorage.removeItem('fall_api_key');
          throw new Error(response.status === 409 ? '备注已被其他操作修改。你的草稿已保留，请重新加载已保存备注并核对后再保存。'
            : response.status === 401 ? '操作密钥不正确或已失效，请重新输入。' : '服务未能保存这次操作，请稍后重试。');
        }
        const result = await response.json();
        if (path === 'note') noteDrafts.delete(id);
        // Apply the server result immediately, even if the following refresh fails.
        alertData = alertData.map(item => item.id === id ? {...item, ...result.alert} : item);
        if (detailAlertId === id && detailAlertData) detailAlertData.alert = result.alert;
        await refresh();
        if (detailAlertId === id) await loadAlertDetail(id);
        return true;
      } catch (error) {
        const message = /备注已被其他操作修改|操作密钥不正确|服务未能保存/.test(error.message)
          ? error.message : '暂时无法保存，请检查网络后重试。未保存的备注仍保留在当前页面。';
        alert(`保存失败：${message}`);
        return false;
      } finally {
        pendingAlerts.delete(id);
        render();
        if (detailAlertId === id && detailAlertData) renderAlertDetail(detailAlertData);
      }
    }

    function setReview(id, confirmed) {
      return updateAlertMark(id, 'review', {confirmed},
        `${confirmed ? '将这条记录标记为已查看' : '撤销这条记录的已查看标记'}？\n\n这只表示是否看过记录，不确认真实跌倒，也不会改变需要报警的标记。`);
    }

    function setAlarmMark(id, alarmRequired) {
      return updateAlertMark(id, 'alarm-mark', {alarm_required:alarmRequired},
        `${alarmRequired ? '标记这条记录需要报警' : '取消这条记录的需要报警标记'}？\n\n这里只保存处理决定，不会发送通知或触发蜂鸣器，也不会改变查看状态。`);
    }

    function saveJudgmentNote(id) {
      if (detailAlertId !== id || pendingAlerts.has(id)) return;
      captureNoteDraft();
      const draft = noteDrafts.get(id);
      if (!draft || Array.from(draft.note).length > 1000) {
        alert('判断备注不能超过 1000 字符。'); return;
      }
      return updateAlertMark(id, 'note', draft,
        '保存这条记录的处理备注？\n\n这不会改变查看状态或需要报警的标记。');
    }

    async function reloadJudgmentNote(id) {
      if (detailAlertId !== id || pendingAlerts.has(id)) return;
      if (!confirm('重新加载已保存备注？当前未保存的草稿将被替换。')) return;
      captureNoteDraft();
      pendingAlerts.add(id);
      render();
      if (detailAlertData) renderAlertDetail(detailAlertData);
      try {
        const data = await getJson(`/api/v1/alerts/${id}/context?before=5&after=5`);
        if (detailAlertId !== id) return;
        noteDrafts.delete(id);
        detailAlertData = data;
        renderAlertDetail(data);
      } catch (error) { alert('暂时无法重新加载。草稿已保留，请稍后重试。'); }
      finally {
        pendingAlerts.delete(id);
        render();
        if (detailAlertId === id && detailAlertData) renderAlertDetail(detailAlertData);
      }
    }

    async function changeIncidentFilters() {
      incidentLimit=50; reminderDisplayLimit=3; render();
      if (refreshInFlight) { refreshRequestId++; await refreshInFlight; }
      await refresh();
    }
    document.querySelector('#hide-tests').addEventListener('change', changeIncidentFilters);
    document.querySelector('#open-only').addEventListener('change', changeIncidentFilters);
    document.querySelector('#incident-detail-dialog').addEventListener('close', () => {
      if (!document.querySelector('#incident-detail-dialog').open) { detailIncidentId=null; detailIncidentData=null; ++incidentDetailRequestId; }
    });
    document.querySelector('#incident-detail-dialog').addEventListener('click', event => {
      if (event.target === event.currentTarget) closeIncidentDetail();
    });
    document.querySelector('#device-detail-dialog').addEventListener('close', () => {
      if (!document.querySelector('#device-detail-dialog').open) detailDeviceId=null;
    });
    document.querySelector('#device-detail-dialog').addEventListener('click', event => {
      if (event.target === event.currentTarget) closeDeviceDetail();
    });
    document.querySelector('#alert-detail-dialog').addEventListener('close', () => {
      if (document.querySelector('#alert-detail-dialog').open) return;
      captureNoteDraft(); detailAlertId = null; detailAlertData = null;
    });
    document.querySelector('#alert-detail-dialog').addEventListener('click', event => {
      if (event.target === event.currentTarget) closeAlertDetail();
    });
    document.querySelector('#operator-name').value = sessionStorage.getItem('fall_operator_name') || '';
    refresh(); setInterval(refresh, 5000);
  </script>
</body>
</html>
